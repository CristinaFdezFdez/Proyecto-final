<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViajaMás - 404 Destino Desconocido</title>
    <link rel="shortcut icon" href="imagenes/logo.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #e8f0ff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container-404 {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #0a6aa6;
            margin: 0;
            text-shadow: 4px 4px 0px #FFC107; 
        }

        .error-title {
            font-size: 2rem;
            color: #333;
            margin-top: -10px;
        }

        .error-text {
            color: #555;
            max-width: 500px;
            margin: 20px auto;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .btn-volver {
            display: inline-block;
            padding: 12px 30px;
            background-color: #0a6aa6;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(10, 106, 166, 0.3);
        }

        .btn-volver:hover {
            background-color: #FFC107;
            color: #333;
            transform: translateY(-3px);
        }

        /* Animación del avión y las nubes */
        .animacion-vuelo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .avion {
            position: absolute;
            top: 20%;
            font-size: 4rem;
            animation: volar 10s linear infinite;
        }

        .nube {
            position: absolute;
            color: white;
            font-size: 5rem;
            opacity: 0.8;
            animation: flotar linear infinite;
        }

        .nube1 { top: 15%; animation-duration: 25s; }
        .nube2 { top: 60%; font-size: 8rem; animation-duration: 35s; animation-delay: -10s; }
        .nube3 { top: 30%; font-size: 4rem; animation-duration: 20s; animation-delay: -5s; }

        @keyframes volar {
            0% { left: -10%; transform: translateY(0px) rotate(15deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { left: 110%; transform: translateY(0px) rotate(20deg); }
        }

        @keyframes flotar {
            0% { left: -20%; }
            100% { left: 110%; }
        }
    </style>
</head>
<body>

    <div class="animacion-vuelo">
        <div class="nube nube1">☁️</div>
        <div class="nube nube2">☁️</div>
        <div class="nube nube3">☁️</div>
        <div class="avion">✈️</div>
    </div>

    <div class="container-404">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">¡Vuelo desviado!</h2>
        <p class="error-text">
            Parece que has intentado aterrizar en un <strong>destino desconocido</strong>. 
            Ni siquiera nuestro mejor radar ha podido encontrar esta página en el mapa. 
            Revisa la URL o vuelve a la terminal principal.
        </p>
        <a href="index.html" class="btn-volver">🛫 Volver al Inicio</a>
    </div>

</body>
</html>
